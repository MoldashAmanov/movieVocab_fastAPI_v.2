<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Vocab{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
        .btn { display: inline-block; background: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #1d4ed8; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <nav>
        <a href="/">← Все фильмы</a> ·
        <a href="/review">🔁 Повторение</a>
        <a href="/stats">📊 Статистика</a> ·
        <a href="/admin">⚙️ Админка</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
